[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "maplestory-classic-tool"
version = "0.1.0"
description = "Screen-reading companion for MapleStory Classic: FM price checker, EXP and meso tracker"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "rapidfuzz",
    "requests",
    "dxcam",
    "mss>=10",
    "winrt-runtime",
    "winrt-Windows.Media.Ocr",
    "winrt-Windows.Graphics.Imaging",
    "winrt-Windows.Storage.Streams",
    "winrt-Windows.Globalization",
    "winrt-Windows.Foundation",
    "winrt-Windows.Foundation.Collections",
]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[tool.setuptools]
packages = ["mapletool"]

[tool.setuptools.package-data]
mapletool = ["assets/*"]

[tool.pytest.ini_options]
markers = ["perf: timing budget", "live: needs running game"]
addopts = "-m 'not live'"
